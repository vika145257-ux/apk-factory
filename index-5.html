<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>मेरी आवाज़ ऐप</title>
<style>
  body{font-family:sans-serif;background:#12141a;color:#eee;margin:0;padding:16px;max-width:520px;margin:auto}
  h1{font-size:22px;text-align:center}
  .box{background:#1d2029;border-radius:12px;padding:14px;margin:12px 0}
  label{display:block;font-size:14px;margin-bottom:6px;color:#aab}
  input,textarea,select{width:100%;box-sizing:border-box;padding:10px;border-radius:8px;border:1px solid #333;background:#0f1117;color:#fff;font-size:16px}
  textarea{min-height:110px}
  button{width:100%;padding:13px;margin-top:8px;border:0;border-radius:10px;font-size:17px;background:#3b82f6;color:#fff}
  button:disabled{opacity:.5}
  button.red{background:#ef4444}
  button.gray{background:#444}
  #status{font-size:14px;color:#9fd;min-height:20px;margin-top:6px}
  #count{font-size:12px;color:#889;text-align:right}
  audio{width:100%;margin-top:8px}
  a.dl{display:block;text-align:center;margin-top:8px;color:#7cf}
</style>
</head>
<body>
<h1>🎙️ मेरी आवाज़ में बोलने वाली ऐप</h1>

<div class="box">
  <label>1) सर्वर का लिंक (README देखें)</label>
  <input id="server" placeholder="https://xxxx.trycloudflare.com" autocapitalize="none" autocomplete="off" spellcheck="false">
  <button class="gray" id="btnPing">लिंक जाँचो</button>
</div>

<div class="box">
  <label>2) अपनी आवाज़ रिकॉर्ड करो (15-30 सेकंड, शांत जगह, साफ़ बोलो)</label>
  <button id="btnRec">🔴 रिकॉर्डिंग शुरू</button>
  <audio id="sample" controls style="display:none"></audio>
  <label style="margin-top:10px">या फोन से आवाज़ की फाइल चुनो</label>
  <input type="file" id="file" accept="audio/*">
</div>

<div class="box">
  <label>3) क्या बुलवाना है, लिखो</label>
  <select id="lang" style="margin-bottom:8px">
    <option value="hi">हिन्दी</option>
    <option value="en">English</option>
  </select>
  <textarea id="text" maxlength="600" placeholder="यहाँ कुछ भी लिखो, वह तुम्हारी आवाज़ में बोलेगा..."></textarea>
  <div id="count">0 / 600</div>
  <button id="btnGo">▶️ मेरी आवाज़ में बोलो</button>
  <div id="status"></div>
  <audio id="out" controls style="display:none"></audio>
  <a class="dl" id="dl" style="display:none" download="meri-awaz.wav">⬇️ आवाज़ सेव / शेयर करो</a>
</div>

<script>
const $ = id => document.getElementById(id);
let sampleBlob = null, rec = null, chunks = [], recStart = 0, outBlob = null;

function say(t){ $("status").textContent = t; }
function saveLocal(k, v){ try{ localStorage.setItem(k, v); }catch(e){} }
function loadLocal(k){ try{ return localStorage.getItem(k) || ""; }catch(e){ return ""; } }

$("server").value = loadLocal("server");
function base(){
  let u = $("server").value.trim().replace(/\/+$/, "");
  if(u && !/^https?:\/\//i.test(u)) u = "https://" + u;
  saveLocal("server", u);
  return u;
}

$("text").addEventListener("input", () => {
  $("count").textContent = $("text").value.length + " / 600";
});

$("btnPing").onclick = async () => {
  if(!base()) return say("पहले लिंक डालो।");
  say("जाँच रहा हूँ...");
  try{
    const r = await fetch(base() + "/ping");
    say(r.ok ? "✅ सर्वर चालू है" : "❌ सर्वर जवाब नहीं दे रहा (Colab चालू है?)");
  }catch(e){ say("❌ सर्वर से जुड़ नहीं पाया। लिंक, नेट और Colab जाँचो।"); }
};

$("btnRec").onclick = async () => {
  if(rec && rec.state === "recording"){ rec.stop(); return; }
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder){
    return say("यहाँ माइक रिकॉर्डिंग नहीं चल रही। नीचे 'आवाज़ की फाइल चुनो' इस्तेमाल करो, या APK में माइक की इजाज़त जोड़ो।");
  }
  try{
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    chunks = [];
    rec = new MediaRecorder(stream);
    rec.ondataavailable = e => { if(e.data && e.data.size) chunks.push(e.data); };
    rec.onstop = () => {
      stream.getTracks().forEach(t => t.stop());
      sampleBlob = new Blob(chunks, {type: rec.mimeType || "audio/webm"});
      $("sample").src = URL.createObjectURL(sampleBlob);
      $("sample").style.display = "block";
      $("btnRec").textContent = "🔴 दोबारा रिकॉर्ड करो";
      $("btnRec").classList.remove("red");
      const secs = Math.round((Date.now() - recStart) / 1000);
      say(secs < 6 ? "आवाज़ बहुत छोटी है (" + secs + " सेकंड)। बेहतर नतीजे के लिए 15-30 सेकंड बोलो।"
                   : "आवाज़ रिकॉर्ड हो गई ✅ (" + secs + " सेकंड)");
    };
    rec.start();
    recStart = Date.now();
    $("btnRec").textContent = "⏹️ रोको";
    $("btnRec").classList.add("red");
    say("रिकॉर्डिंग चल रही है... बोलते रहो");
  }catch(e){ say("माइक चालू नहीं हुआ। फोन सेटिंग में इस ऐप को माइक की इजाज़त दो।"); }
};

$("file").onchange = e => {
  const f = e.target.files[0];
  if(!f) return;
  sampleBlob = f;
  $("sample").src = URL.createObjectURL(f);
  $("sample").style.display = "block";
  say("फाइल चुन ली ✅");
};

function toB64(blob){
  return new Promise((ok, bad) => {
    const r = new FileReader();
    r.onload = () => ok(String(r.result).split(",")[1] || "");
    r.onerror = () => bad(r.error);
    r.readAsDataURL(blob);
  });
}
function isNative(){
  const C = window.Capacitor;
  return !!(C && C.isNativePlatform && C.isNativePlatform() && C.Plugins && C.Plugins.Filesystem && C.Plugins.Share);
}
// APK के अंदर सीधा डाउनलोड नहीं चलता, इसलिए फाइल बनाकर "शेयर/सेव" खोलते हैं
$("dl").onclick = async (e) => {
  if(!outBlob) return;
  if(isNative()){
    if(e && e.preventDefault) e.preventDefault();
    try{
      const C = window.Capacitor;
      const data = await toB64(outBlob);
      const w = await C.Plugins.Filesystem.writeFile({path: "meri-awaz-" + Date.now() + ".wav", data: data, directory: "CACHE"});
      await C.Plugins.Share.share({title: "मेरी आवाज़", url: w.uri, dialogTitle: "आवाज़ सेव या शेयर करो"});
      say("खुले मेन्यू में 'Drive', 'Files' या WhatsApp चुनकर सेव करो ✅");
    }catch(err){
      if(!/cancel/i.test(String(err && err.message))) say("सेव नहीं हो पाया: " + (err && err.message ? err.message : err));
    }
    return;
  }
  if(navigator.canShare && navigator.share && typeof File !== "undefined"){
    try{
      const f = new File([outBlob], "meri-awaz.wav", {type: "audio/wav"});
      if(navigator.canShare({files: [f]})){
        if(e && e.preventDefault) e.preventDefault();
        await navigator.share({files: [f], title: "मेरी आवाज़"});
      }
    }catch(err){}
  }
};

$("btnGo").onclick = async () => {
  const text = $("text").value.trim();
  if(!base()) return say("पहले सर्वर का लिंक डालो।");
  if(!sampleBlob) return say("पहले अपनी आवाज़ रिकॉर्ड करो या फाइल चुनो।");
  if(!text) return say("कुछ टेक्स्ट लिखो।");
  say("आवाज़ बन रही है... (पहली बार 1 मिनट तक लग सकता है)");
  $("btnGo").disabled = true;
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 150000);
  try{
    const fd = new FormData();
    fd.append("text", text);
    fd.append("lang", $("lang").value);
    fd.append("voice", sampleBlob, "voice.webm");
    const r = await fetch(base() + "/speak", {method:"POST", body: fd, signal: ctrl.signal});
    if(!r.ok){
      let msg = "";
      try{ msg = (await r.json()).error; }catch(e){}
      if(!msg) msg = (r.status === 524 || r.status === 504) ? "समय ज़्यादा लग गया, छोटा टेक्स्ट आज़माओ" : "सर्वर ने गलती बताई (" + r.status + ")";
      throw new Error(msg);
    }
    const blob = await r.blob();
    outBlob = blob;
    const url = URL.createObjectURL(blob);
    $("out").src = url; $("out").style.display = "block";
    $("dl").href = url; $("dl").style.display = "block";
    try{ await $("out").play(); }catch(e){}
    say("तैयार ✅");
  }catch(e){
    if(e.name === "AbortError") say("बहुत देर हो गई। छोटा टेक्स्ट आज़माओ।");
    else if(e instanceof TypeError) say("सर्वर से जुड़ नहीं पाया। नेट, लिंक और Colab जाँचो।");
    else say("❌ " + e.message);
  }
  clearTimeout(timer);
  $("btnGo").disabled = false;
};
</script>
</body>
</html>
